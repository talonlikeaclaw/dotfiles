providers: 
  webSearchOrder: 
    - codex
    - perplexity
    - gemini
    - anthropic
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
modelRoles: 
  default: openai-codex/gpt-5.6-terra
  smol: openai-codex/gpt-5.6-luna
  slow: openai-codex/gpt-5.6-sol
symbolPreset: nerd
theme: 
  dark: titanium
  light: light
setupVersion: 2
memory: 
  backend: mnemopi
mnemopi: 
  scoping: per-project-tagged
compaction: 
  enabled: true
  methodOrder:
    - snapcompact
  midTurnEnabled: true
  thresholdPercent: -1
  thresholdTokens: -1
defaultThinkingLevel: auto
dev: 
  autoqaConsent: granted
mcp: 
  enableProjectConfig: false
disabledProviders: 
  - gemini
  - agent-plugins
  - agents
  - agents-md
  - claude
  - claude-plugins
  - cline
  - codex
  - cursor
  - github
  - mcp-json
  - opencode
  - vscode
  - windsurf
skills:
  enabled: true
  enableSkillCommands: true
  customDirectories:
    - ~/.omp/agent/skill-sources/caveman/skills
    - ~/.omp/agent/skill-sources/ponytail/skills
    - ~/.omp/agent/skill-sources/anthropics-skills/skills
    - ~/.omp/agent/skill-sources/vercel-agent-skills/skills
    - ~/.omp/agent/skill-sources/mattpocock-skills/skills/engineering
    - ~/.omp/agent/skill-sources/supabase-agent-skills/skills
    - ~/.omp/agent/manual-skills
  includeSkills:
    - caveman
    - ponytail
    - superpowers
    - frontend-design-manual
    - web-design-guidelines
    - vercel-react-best-practices
    - vercel-composition-patterns
    - codebase-design-manual
    - improve-codebase-architecture
    - supabase-postgres-best-practices
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
  enablePiUser: false
  enablePiProject: false
  enableAgentsUser: false
  enableAgentsProject: false
commands: 
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
composer: 
  shape: rail
tools: 
  approvalMode: always-ask
  approval:
    bash: prompt
    read: allow
  format: auto
  intentTracing: true
edit: 
  mode: hashline
hideThinkingBlock: true
autolearn: 
  enabled: true
vault: 
  enabled: true
security: 
  enabled: true
plan: 
  defaultOnStartup: false
secrets: 
  enabled: true