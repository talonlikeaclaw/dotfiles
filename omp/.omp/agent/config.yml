modelRoles:
  default: opencode-go/deepseek-v4.1-flash
  smol: opencode-go/deepseek-v4.1-flash
  slow: opencode-go/glm-5.3:high
  plan: opencode-go/glm-5.3:high
  advisor: opencode-go/glm-5.3:low
  vision: opencode-go/gemini-4-argon
  memory: opencode-go/deepseek-v4.1-flash
  task: opencode-go/deepseek-v4.1-flash
  judge: opencode-go-systemone/jev-1.14
  tiny: local/lfm2.5-230m
  web: web/exa
symbolPreset: nerd
theme:
  dark: titanium
  light: light
setupVersion: 2
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
  recallRelevance: auto
  enhancedRecall: true
compaction:
  enabled: true
  methodOrder:
    - snapcompact
  midTurnEnabled: true
  thresholdPercent: -1
  thresholdTokens: -1
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
mcp:
  enableProjectConfig: false
disabledProviders:
  - gemini
  - agent-plugins
  - agents
  - agents-md
  - claude
  - claude-plugins
  - cline
  - codex
  - cursor
  - github
  - mcp-json
  - opencode
  - vscode
  - windsurf
skills:
  enabled: true
  enableSkillCommands: true
  customDirectories:
    # First so the manual launchers win name collisions against upstream
    # copies (e.g. improve-codebase-architecture in mattpocock-skills).
    - ~/.omp/agent/manual-skills
    - ~/.omp/agent/skill-sources/caveman/skills
    - ~/.omp/agent/skill-sources/ponytail/skills
    - ~/.omp/agent/skill-sources/anthropics-skills/skills
    - ~/.omp/agent/skill-sources/vercel-agent-skills/skills
    - ~/.omp/agent/skill-sources/mattpocock-skills/skills/engineering
    - ~/.omp/agent/skill-sources/supabase-agent-skills/skills
    - ~/.omp/agent/skill-sources/impeccable/.agents/skills
  includeSkills:
    - caveman
    - ponytail
    - superpowers
    - frontend-design-manual
    - web-design-guidelines
    - vercel-react-best-practices
    - vercel-composition-patterns
    - codebase-design-manual
    - improve-codebase-architecture
    - supabase-postgres-best-practices
    - impeccable
  # The manual launcher above wins the name; drop the upstream duplicate from
  # discovery (its file stays on disk for the launcher to read).
  ignoredSkills:
    - mattpocock-skills/improve-codebase-architecture
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
  enablePiUser: false
  enablePiProject: false
  enableAgentsUser: false
  enableAgentsProject: false
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
composer:
  shape: rail
tools:
  approvalMode: yolo
  approval:
    bash: allow
    read: allow
  format: auto
  intentTracing: true
edit:
  mode: hashline
hideThinkingBlock: true
autolearn:
  enabled: true
vault:
  enabled: true
security:
  enabled: true
plan:
  defaultOnStartup: false
secrets:
  enabled: true
retry:
  rateLimitWalksChain: true
  usageAwareFallback: true
  fallbackChains:
    default:
      - opencode-zen/deepseek-v4.1-flash
      - opencode-zen/gpt-6-luna
    slow:
      - opencode-zen/glm-5.3
      - opencode-zen/deepseek-v4.1-flash
    plan:
      - opencode-zen/glm-5.3
      - opencode-zen/deepseek-v4.1-flash
    judge:
      - opencode-zen/jev-1.13-free
      - opencode-zen/jev-1.13
    vision:
      - opencode-zen/gemini-4-argon
      - opencode-zen/gemini-3.8-flash
    web:
      - web/duckduckgo
      - web/public
      - web/perplexity
      - web/zai
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/ecosia
      - web/google
      - web/mojeek
      - web/ollama
checkpoint:
  enabled: true
error:
  notify: "on"
cycleOrder:
  - default
  - slow
