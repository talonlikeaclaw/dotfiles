modelRoles:
  slow: opencode-go/glm-5.3:auto
  web: openai-codex/gpt-5.6-luna
  judge: opencode-go/glm-5.3:auto
  default: opencode-go/deepseek-v4.1-flash
  smol: opencode-go/deepseek-v4.1-flash:auto
  vision: opencode-go/deepseek-v4-flash-vision-exp:auto
symbolPreset: nerd
theme:
  dark: titanium
  light: light
setupVersion: 2
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
compaction:
  enabled: true
  methodOrder:
    - snapcompact
  midTurnEnabled: true
  thresholdPercent: -1
  thresholdTokens: -1
defaultThinkingLevel: auto
dev:
  autoqaConsent: granted
mcp:
  enableProjectConfig: false
disabledProviders:
  - gemini
  - agent-plugins
  - agents
  - agents-md
  - claude
  - claude-plugins
  - cline
  - codex
  - cursor
  - github
  - mcp-json
  - opencode
  - vscode
  - windsurf
skills:
  enabled: true
  enableSkillCommands: true
  customDirectories:
    - ~/.omp/agent/skill-sources/caveman/skills
    - ~/.omp/agent/skill-sources/ponytail/skills
    - ~/.omp/agent/skill-sources/anthropics-skills/skills
    - ~/.omp/agent/skill-sources/vercel-agent-skills/skills
    - ~/.omp/agent/skill-sources/mattpocock-skills/skills/engineering
    - ~/.omp/agent/skill-sources/supabase-agent-skills/skills
    - ~/.omp/agent/manual-skills
  includeSkills:
    - caveman
    - ponytail
    - superpowers
    - frontend-design-manual
    - web-design-guidelines
    - vercel-react-best-practices
    - vercel-composition-patterns
    - codebase-design-manual
    - improve-codebase-architecture
    - supabase-postgres-best-practices
  enableCodexUser: false
  enableClaudeUser: false
  enableClaudeProject: false
  enablePiUser: false
  enablePiProject: false
  enableAgentsUser: false
  enableAgentsProject: false
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
composer:
  shape: rail
tools:
  approvalMode: yolo
  approval:
    bash: allow
    read: allow
  format: auto
  intentTracing: true
edit:
  mode: hashline
hideThinkingBlock: true
autolearn:
  enabled: true
vault:
  enabled: true
security:
  enabled: true
plan:
  defaultOnStartup: false
secrets:
  enabled: true
retry:
  fallbackChains:
    web:
      - web/perplexity
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama